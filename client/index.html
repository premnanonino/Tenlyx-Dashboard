<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0B" />
    <title>TLX/MON — Billing Monitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151515'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23E0482A'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Shown only until the app mounts; if the bundle never loads, the delayed hint explains why. -->
      <div style="position:fixed;inset:0;display:grid;place-content:center;gap:14px;background:#0c0c0b;color:#efebe2;font:12px/1.5 'IBM Plex Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center">
        <span>TLX/MON · loading</span>
        <span style="color:#8c867a;opacity:0;animation:tlx-late .01s 8s forwards">Still loading. Check your connection, then reload the page.</span>
        <style>@keyframes tlx-late{to{opacity:1}}</style>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;display:grid;place-content:center;padding:24px;background:#0c0c0b;color:#efebe2;font:14px/1.5 ui-monospace,Menlo,monospace;text-align:center">
        TLX/MON needs JavaScript to show your billing data. Enable it for this site and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
